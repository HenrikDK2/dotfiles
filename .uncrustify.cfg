# Uncrustify 0.83.0
# Style: K&R-ish, tab indent, hanging function params, e.g.
#   wl_registry_add_listener(
#       registry,
#       &registry_listener,
#       wayland
#   );

newlines                           = lf
input_tab_size                     = 4
output_tab_size                    = 4
string_replace_tab_chars           = false

# --- Indentation ---
indent_columns                     = 4
indent_with_tabs                  = 1   # indent levels with tabs
indent_ignore_first_continue       = false
indent_continue                    = 0
indent_param                       = 0
indent_paren_close                 = 2   # don't indent closing paren (aligns with statement start)

indent_func_call_param             = true
indent_func_def_param              = true
indent_func_proto_param            = true
indent_func_param_double           = false
donot_indent_func_def_close_paren  = true

# --- Switch ---
indent_switch_case                 = 4
indent_switch_pp                   = true
indent_switch_body                 = 0
indent_case_shift                  = 0
indent_case_brace                  = 0
indent_break_at_case_brace         = false

# --- Pointers ---
sp_before_ptr_star                 = force
sp_after_ptr_star                  = remove

# --- Function definitions ---
nl_func_def_paren                  = ignore
nl_func_def_paren_empty            = ignore
nl_func_def_start                  = force
nl_func_def_start_single           = remove
nl_func_def_start_multi_line       = true
nl_func_def_args                   = force
nl_func_def_args_multi_line        = true
nl_func_def_end                    = force
nl_func_def_end_single             = remove
nl_func_def_end_multi_line         = true
nl_func_def_empty                  = ignore

# --- Function declarations / prototypes ---
nl_func_decl_start                 = force
nl_func_decl_start_single          = remove
nl_func_decl_start_multi_line      = true
nl_func_decl_args                  = force
nl_func_decl_args_multi_line       = true
nl_func_decl_end                   = force
nl_func_decl_end_single            = remove
nl_func_decl_end_multi_line        = true
nl_func_decl_empty                 = ignore

# --- Function param alignment: never align under open paren ---
align_func_params                  = false
align_func_params_span             = 0

# --- Function prototypes / typedefs ---
nl_func_type_name                  = remove
nl_func_type_name_class            = remove
nl_func_proto_type_name            = remove

nl_fdef_brace                      = ignore
nl_func_leave_one_liners           = false
nl_create_func_def_one_liner       = false

# --- Function calls: don't force reflow, but keep existing multiline shape ---
nl_func_call_paren                 = ignore
nl_func_call_paren_empty           = ignore
nl_func_call_start                 = ignore
nl_func_call_start_multi_line      = true
nl_func_call_args                  = ignore
nl_func_call_args_multi_line       = true
nl_func_call_end                   = ignore
nl_func_call_end_multi_line        = true
nl_func_call_empty                 = ignore
ls_func_split_full                 = false

# --- Control-flow braces ---
mod_full_brace_if                  = ignore
mod_full_brace_for                 = ignore
mod_full_brace_while                = ignore
mod_full_brace_do                  = ignore
mod_full_brace_nl                  = 1

nl_if_brace                        = ignore
nl_brace_if                        = remove
nl_elseif_brace                    = ignore
nl_else_if                         = remove
nl_for_brace                       = ignore
nl_while_brace                     = ignore
nl_do_brace                        = ignore
nl_brace_while                     = remove
nl_brace_brace                     = ignore

nl_before_for                      = force
nl_after_for                       = force
nl_before_while                    = force
nl_after_while                     = force
nl_before_do                       = force
nl_after_do                        = force
nl_before_if                       = force
nl_after_if                        = force

# --- struct/enum/union braces: opening brace stays on same line ---
nl_struct_brace                    = remove
nl_enum_brace                      = remove
nl_union_brace                     = remove
nl_after_struct                    = 2
nl_after_class                     = 2
nl_brace_struct_var                = remove   # keep "} varname;" together, e.g. anonymous struct/union members

eat_blanks_after_open_brace        = false
eat_blanks_before_close_brace      = false

nl_after_semicolon                 = true
nl_after_brace_open                = true
nl_after_brace_close               = true
nl_after_vbrace_close              = true
nl_if_leave_one_liners             = false
nl_assign_leave_one_liners         = false

nl_brace_else                      = remove   # keep "} else" together

nl_before_func_body_def            = 2
nl_after_func_body                 = 2

# --- Operator spacing ---
sp_arith                           = force
sp_assign                          = force
sp_bool                            = force
sp_compare                         = force
sp_inside_paren                    = remove
sp_paren_paren                     = remove
sp_before_sparen                   = force
sp_after_sparen                    = force
sp_sparen_brace                    = force
sp_before_comma                    = remove
sp_after_comma                     = force
sp_before_semi                     = remove
sp_after_semi                      = force
sp_after_semi_for_empty            = remove
sp_before_square                   = remove
sp_before_squares                  = remove
sp_inside_square                   = remove

sp_func_call_paren                 = remove
sp_func_call_paren_empty           = remove
sp_func_def_paren                  = remove
sp_func_def_paren_empty            = remove
sp_func_proto_paren                = remove
sp_func_proto_paren_empty          = remove

sp_not                              = remove
sp_inv                              = remove
sp_addr                             = remove
sp_member                           = remove
sp_deref                            = remove
sp_sign                             = remove
sp_incdec                           = remove

# --- Blank lines ---
nl_max                              = 2
nl_max_blank_in_func                = 2
nl_start_of_file                    = remove
nl_end_of_file                      = force
nl_end_of_file_min                  = 1

# --- Comments ---
sp_cmt_cpp_start                    = force
cmt_star_cont                       = true
cmt_indent_multi                    = true

# --- Preprocessor ---
pp_indent                           = force
pp_indent_at_level                  = true
pp_define_at_level                  = true
pp_space                            = remove
