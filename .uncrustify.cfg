# Indentation
indent_columns                  = 4
indent_with_tabs                = 0

indent_ignore_first_continue    = false
indent_continue                 = 0
indent_param                    = 0
indent_paren_close              = 2

indent_func_def_param           = true
indent_func_def_param_paren_pos_threshold = 0
indent_func_proto_param         = false

donot_indent_func_def_close_paren = true

# Pointer spacing
sp_before_ptr_star              = force
sp_after_ptr_star               = remove


# Function definitions
nl_func_def_paren               = ignore
nl_func_def_paren_empty         = ignore

nl_func_def_start               = force
nl_func_def_start_single        = remove
nl_func_def_start_multi_line    = false

nl_func_def_args                = force
nl_func_def_args_multi_line     = false

nl_func_def_end                 = force
nl_func_def_end_single          = remove
nl_func_def_end_multi_line      = false

nl_func_def_empty               = ignore


# Function parameters
align_func_params               = false
align_func_params_span          = 0


# Function braces
nl_fdef_brace                   = ignore

nl_func_leave_one_liners        = false
nl_create_func_def_one_liner    = false


# Function calls
# Left on 'ignore' on purpose: uncrustify has no way to force splitting
# only for calls with 3+ args, so calls like wl_registry_bind(...) that
# you want spread one-arg-per-line need to be wrapped by hand. Leaving
# these on ignore means uncrustify won't fight you or re-collapse them,
# and short calls like strcmp(...) are left untouched too.
nl_func_call_paren               = ignore
nl_func_call_paren_empty         = ignore
nl_func_call_start               = ignore
nl_func_call_start_multi_line    = false
nl_func_call_args                = ignore
nl_func_call_args_multi_line     = false
nl_func_call_end                 = ignore
nl_func_call_end_multi_line      = false
nl_func_call_empty               = ignore


# One statement per line / brace splitting
# Forces multi-statement single lines (e.g. "static X; static Y; void f(){...}")
# apart into one statement per line, and puts opening/closing braces of
# compound statements on their own line instead of trailing the prior code.
nl_after_semicolon              = true
nl_after_brace_open             = true
nl_after_brace_close            = true
nl_after_vbrace_close           = true
nl_if_leave_one_liners          = false
nl_assign_leave_one_liners      = false

# Keep "} else" / "} else if" glued together instead of splitting the
# else onto its own line (nl_after_brace_close would otherwise do that).
nl_brace_else                   = remove

# Blank line before/after multi-line function definitions, so functions
# stacked with no blank lines between them get separated.
nl_before_func_body_def         = 2
nl_after_func_body              = 2

# Blank line before/after top-level 'if' blocks inside a function body
# (matches the guard-clause spacing style in main()).
nl_before_if                    = force
nl_after_if                     = force
